                  key: secretKey
            - name: SCHEMA_API_USE_FILES
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: filesEnabled
            - name: SCHEMA_API_USE_AUTH
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: authEnabled
            - name: SCHEMA_API_S3_URL
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: s3Url
            - name: SCHEMA_API_S3_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: s3UseSSL
            - name: SCHEMA_API_S3_VERIFY_SSL
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: s3UseSSL
            - name: SCHEMA_API_S3_MAX_PART_SIZE_BYTES
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: s3MaxPartSize
            - name: SCHEMA_API_USERNAME_SLUG_PATTERN
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: slugPattern
            - name: SCHEMA_API_CONTEXT_NAME_SLUG_PATTERN
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: slugPattern
            - name: SCHEMA_API_TASK_API_CLASS
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: taskApiClass
            - name: SCHEMA_API_TASK_API_GET_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: teskEndpoint
            - name: SCHEMA_API_TASK_API_CREATE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: schema-api-config
                  key: teskEndpoint
            - name: SCHEMA_API_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access_key_id
            - name: SCHEMA_API_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret_access_key
            - name: SCHEMA_API_USER_THROTTLE_RATE
              valueFrom:
