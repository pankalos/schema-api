---

apiVersion: v1
kind: Service                 # Schema Api Service 
metadata:
  name: schema-api
  namespace: schema-api
  labels:
    app: schema-api
spec:
  selector:
    app: schema-api
    role: service
    purpose: main
  # ports:
  #   - protocol: TCP
  #     port: 8000
  type: NodePort               # <----- NodePort        
  ports:
    - targetPort: 8000
      port: 8000
      nodePort: 30090

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-api-cache
  namespace: schema-api
  labels:
    app: schema-api
    role: cache
    purpose: main
    provider: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-api
      role: cache
      purpose: main
      provider: redis
  template:
    metadata:
      labels:
        app: schema-api
        role: cache
        purpose: main
        provider: redis
    spec:
      containers:
        - image: redislabs/redisearch:latest
          name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: schema-api
  labels:
    app: schema-api
spec:
  selector:
    app: schema-api
    role: cache
    purpose: main
    provider: redis
  ports:
    - protocol: TCP
      port: 6379

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-workers
  namespace: schema-api
  labels:
    app: schema-api
    role: worker
    purpose: main
    backend: tesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-api
      role: worker
      purpose: main
      backend: tesk
  template:
    metadata:
      labels:
        app: schema-api
        role: worker
        purpose: main
        backend: tesk
    spec:
      containers:
        - image: schemaservices/schema-utils:0.1.0
          name: schema-worker
          command:
            - 'python'
            - '-m'
            - 'brokers.tesk'
            - '-v'
            - '3'
            - 'redis://redis-cache'
            # - 'http://tesk.example.com'                                  # Change according to your environment's TESK API URL
            - 'http://tesk-api.tesk.svc.cluster.local:8080'                # Change according to your environment's TESK API URL
