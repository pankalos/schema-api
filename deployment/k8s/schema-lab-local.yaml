apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-lab-config
  namespace: schema-api
data:
  schemaApiUrl: http://192.168.2.9:30090                           # Change according to your case

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-lab
  namespace: schema-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-lab
  template:
    metadata:
      labels:
        app: schema-lab
    spec:
      containers:
        - name: schema-lab
          image: schemaservices/schema-lab:20251127
          env:
            - name: SCHEMA_LAB_SCHEMA_API_URL
              valueFrom:
                configMapKeyRef:
                  name: schema-lab-config
                  key: schemaApiUrl

---

apiVersion: v1
kind: Service
metadata:
  name: schema-lab
  namespace: schema-api
spec:
  selector:
    app: schema-lab
  type: NodePort               # <----- NodePort        
  ports:
    - targetPort: 80
      port: 80
      nodePort: 30100
